services:
  - type: web
    name: aapdamitra-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: "Day  07/Dockerfile"
    dockerContext: "Day  07"
    dockerCommand: >-
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: PORT
        value: 10000
      # Set these two secrets in the Render dashboard → Environment.
      # Never commit real values here.
      # GROQ_API_KEY   — your Groq key (gsk_...)
      # API_SECRET_KEY — any long random string; the UI must share it

  - type: web
    name: aapdamitra-ui
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: "Day  07/Dockerfile"
    dockerContext: "Day  07"
    dockerCommand: >-
      streamlit run ui/app.py --server.address 0.0.0.0 --server.port $PORT
    healthCheckPath: /_stcore/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: 10000
      - key: API_URL
        value: https://aapdamitra-api.onrender.com
      # API_SECRET_KEY — must match the value set on aapdamitra-api
